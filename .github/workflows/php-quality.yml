name: PHP and JS source validation
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version and clean release boundaries
        run: |
          test "$(cat VERSION)" = "0.6.25"
          test ! -e config/config.php
          test ! -e storage/installed.lock
          test ! -e error_log
          test -f database/migrations/014_company_transfer_settings.sql
      - name: PHP syntax
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JS syntax
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
